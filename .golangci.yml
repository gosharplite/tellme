# golangci-lint policy (round 002 / research Decision 2).
#
# Adopts the lint aggregator and enables errcheck — closing the round-001
# unchecked-error residual. The surface stays minimal: only gates the team has
# ratified. `staticcheck` and `go vet` remain independent Makefile gates.
version: "2"

linters:
  default: standard
  enable:
    - errcheck
