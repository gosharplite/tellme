# yaml-language-server: $schema=https://modelith.sh/schema/domain-model/v1.json
kind: DomainModel
version: v1
title: tellme — Multi-Provider Reasoning Agent (POSIX CLI)
description: >
  A disciplined, POSIX/bash-only re-creation of tell-me-go. A CLI that turns a
  prompt into a multi-round reasoning turn: it assembles a provider payload
  (persona + recent history + the prompt), drives a bounded
  think→act→observe loop against a multi-provider `Provider` (the two families
  tellme drives — OpenAI-compatible and Gemini), executes agent `Tool`s, streams
  a diagnostic `Chrome`, and persists the session. Three operator-declared directions shape it: **no
  security layer**, **no Windows**, and **bash-first** — hence a deliberately
  small tool surface. Skills reach the model on demand (no automatic injection).

glossary:
  Orchestrator: >
    The turn driver: it assembles the `Context`, calls the selected `Provider`,
    dispatches `ToolCall`s in a bounded loop, renders the `Chrome`, and persists
    the `Turn`. In the code it is `internal/agent`'s loop, reached through the
    injected domain port `agentport.Loop` (ADR 0019), so the CLI names no
    `internal/agent` identifier.
  Chrome: >
    The diagnostic surface written to `stderr` on a turn: the turn rule/header,
    the payload status lines, the `[Tool …]` lines, the `[Tool Output]` block,
    the spinner, and the Ready summary. Terminal-gated accents are colour; the
    rest is plain text. Distinct from the answer, which is the rendered
    Markdown on `stdout`.
  Persona: >
    The agent identity for a session — a MODE (e.g. `butler`) plus a PERSON
    system prompt, read from the `Config`. `TELL_ME_MODE` selects the mode for
    the offline session commands. The in-group peer agents (`pm`, `rd`,
    `architect`, `coder`, `griller`) are sibling personas of the same manager.
  TellMeHome: >
    The filesystem root for all tellme state — `$TELL_ME_HOME` — holding the
    `docs/skills/` catalog, the per-mode `output/<mode>/` workspaces (history,
    turns log, usage log), and configs. Managed by the external Niffler script
    (see the environment-management model); tellme treats it as the stable
    namespace for everything it persists. Two artifacts live **outside** it, in
    the user-global `~/.tellme/` root: the shared prompt log and the tool-usage
    log.
  NoSecurityLayer: >
    A settled exclusion, not an omission: tellme ships **no** SafePath
    authorization, consent prompt, command whitelist, or path boundary. Tools
    read, write, and execute whatever they are given; the resulting risk is an
    explicitly accepted operator decision. The reference's SecurityManager /
    UserInteractor are therefore **absent** from this model.

enums:
  ProviderFamily:
    description: >
      The wire-protocol family backing a `Provider` — the compile-time-safe
      dispatch dimension, distinct from the user-facing provider label (which
      may name an OpenAI-compatible vendor). tellme drives exactly two families;
      a label resolving to any other family (for example `anthropic`) is refused
      with the frozen provider-error phrase and never reaches a transport.
    values:
      - name: openai
        definition: OpenAI-compatible (covers openai, deepseek, kimi, and any OpenAI-protocol vendor).
      - name: gemini
        definition: Google Gemini / Vertex AI (covers the google and gemini labels).
  ToolOutcome:
    description: The recorded fate of one executed `ToolCall`.
    values:
      - name: ok
        definition: The tool ran; the result is kept (including a bounded/truncated result).
      - name: error
        definition: The tool returned a non-nil error.
      - name: timeout
        definition: The per-call deadline expired; the tool returned a nil-error "stopped" result.
  ToolGate:
    description: >
      The capability gate on a `Tool`'s availability (round 062; ADR 0032). A
      `vision` tool (`read_image`) is offered only to a `Provider` that declares
      `vision`; `none` is offered to every provider.
    values:
      - name: none
        definition: Always offered (the readers, the write pair, `execute_command`, `list_skills`).
      - name: vision
        definition: Offered only when the selected `Provider` declares `vision`.
  PayloadStatusKind:
    description: The two payload figures the `Chrome` reports per `Turn`.
    values:
      - name: estimated
        definition: The pre-flight estimate, rendered as a signed increment plus the estimate (`+<delta> ~<n> tokens`), computed before the provider call.
      - name: measured
        definition: The post-turn measured count, from the provider's usage report.

entities:
  Config:
    definition: >
      The YAML configuration loaded at startup (the `-c` path, else the
      default). It carries the `Persona` (MODE/PERSON), the `Provider`
      registry plus `SELECTED_PROVIDER`, per-model `Pricing`/context-window
      overrides, the `USE_TUI_PROMPT` toggle, the session limits (`MAX_TOOL_LOOP`,
      `MAX_HISTORY_TOKENS`, `WRAP_WIDTH` — the tool-resource budget derives from
      `MAX_HISTORY_TOKENS`), and the `MCPServer` declarations. `${VAR}`
      placeholders are expanded at load. It carries **no** security/consent keys —
      the no-security-layer direction.
    attributes:
      - name: mode
        type: string
        description: The persona identity (YAML MODE).
      - name: selectedProvider
        type: string
        description: Registry key of the active `Provider`.
      - name: maxToolLoop
        type: integer
        description: Bound on tool rounds within one `Turn` (YAML `MAX_TOOL_LOOP`).
      - name: maxHistoryTokens
        type: integer
        description: Token budget for the retained `Context`.
    relationships:
      - entity: Provider
        cardinality: "1:n"
        ownership: owned
        note: The provider registry (YAML PROVIDERS).
      - entity: Pricing
        cardinality: "1:n"
        ownership: owned
        note: Per-model overrides (YAML MODELS).
      - entity: MCPServer
        cardinality: "1:n"
        ownership: owned
        note: Configured external MCP servers (YAML `MCP_SERVERS`).
    invariants:
      - id: config-selected-provider-resolves
        statement: "`selectedProvider` MUST reference a key in the `Provider` registry."
      - id: config-no-security-keys
        statement: "`Config` carries no security/consent keys — there is no authorization surface."

  Provider:
    definition: >
      An LLM backend reachable via one ProviderFamily. It carries a model id,
      a base URL, authentication, and optional thinking settings; one is selected
      per session from the `Config` registry. tellme speaks the two families
      through thin transports; a vendor is just a label mapping to a family.
    attributes:
      - name: label
        type: string
        description: The free-form provider label (e.g. `deepseek`, `kimi`).
      - name: family
        type: ProviderFamily
        derived: true
        derivation: Resolved from the label.
      - name: model
        type: string
        description: The model identifier sent on the wire.
      - name: vision
        type: boolean
        description: >
          Whether this provider accepts image input (YAML `VISION`, default
          false; round 062 / ADR 0032). Declared, never inferred from the model
          name or the family; when false the `read_image` `Tool` is not offered.
          Round 063 / ADR 0033: the single `VISION` key is honoured by **both**
          families — the OpenAI-compatible `image_url` block and the
          Gemini/Vertex `inlineData` blob.
    relationships:
      - entity: Pricing
        cardinality: "n:1"
        ownership: referenced
        note: The per-model pricing/window the `Provider`'s model resolves to.
    invariants:
      - id: provider-label-resolves-to-one-family
        statement: "Every provider label MUST resolve to exactly one ProviderFamily."
      - id: provider-family-must-be-drivable
        statement: "A label resolving to a family tellme cannot drive (e.g. `anthropic`) is refused with the frozen provider-error phrase — tellme drives only the `openai` and `gemini` families."

  Pricing:
    definition: >
      The per-model cost + context-window table. It maps a model id to a
      context window and the per-million-token rates; the effective token budget
      for a session derives from the configured `MAX_HISTORY_TOKENS` and the
      active model's window.
    attributes:
      - name: modelName
        type: string
        description: The model id this row applies to.
      - name: contextWindow
        type: integer
        description: Maximum token capacity for the model.
    invariants:
      - id: pricing-unique-model
        statement: "Each `modelName` appears at most once in the pricing table."

  Session:
    definition: >
      One conversation under a per-mode workspace. It owns the `History`, the
      `TurnLog`, and the `UsageRecord` stream, all under the `TellMeHome`
      (`$TELL_ME_HOME`) subtree `output/<mode>/`; `--new` archives them and starts
      fresh. The offline readers (`-l`, `-t`, `--tool-usage`, prompt-less `--new`)
      resolve the mode as `TELL_ME_MODE` → the `-c` config's MODE → the default
      config's MODE → `butler`, and stay offline (a mode-only config parse).
    attributes:
      - name: mode
        type: string
        description: The persona identity this session runs under.
    relationships:
      - entity: Turn
        cardinality: "1:n"
        ownership: owned
      - entity: History
        cardinality: "1:1"
        ownership: owned
        note: Persisted record of this session's completed turns.
      - entity: TurnLog
        cardinality: "1:1"
        ownership: owned
        note: The per-session rendered-chrome text file (`turns.log`).
      - entity: Persona
        cardinality: "n:1"
        ownership: referenced
        note: The persona the session runs under.
      - entity: Config
        cardinality: "n:1"
        ownership: referenced
    invariants:
      - id: session-mode-resolves-deterministically
        statement: "A session's mode resolves by the fixed precedence `TELL_ME_MODE` → the `-c` config's MODE → the default config's MODE → `butler`."
      - id: session-offline-reads-stay-offline
        statement: "The offline readers (`-l`, `-t`, `--tool-usage`, prompt-less `--new`) make no provider request."

  Turn:
    definition: >
      One atomic exchange: the prompt, zero or more provider rounds
      (interleaved with `ToolCall` execution), and a final answer. A turn is
      bounded by `MAX_TOOL_LOOP` tool rounds. On completion it is persisted as a
      single `history.jsonl` line `{prompt, answer, steps[], calls}` — the
      provider's answer text verbatim (content, not the rendered form). Each
      executed step records its provider `signature` when the provider emits one,
      so a resumed session replays faithfully.
    attributes:
      - name: prompt
        type: string
        description: The user's input text.
      - name: answer
        type: string
        description: The provider's final answer text (verbatim).
      - name: callCount
        type: integer
        description: The number of AI-endpoint calls this turn made (stored as `calls`).
    relationships:
      - entity: ToolCall
        cardinality: "1:n"
        ownership: owned
      - entity: Session
        cardinality: "n:1"
        ownership: referenced
    invariants:
      - id: turn-bounded-by-tool-loop
        statement: "The tool rounds within one `Turn` MUST NOT exceed `Config.maxToolLoop`."
      - id: turn-answer-stored-verbatim
        statement: "A `Turn`'s persisted `answer` is the provider's content, never the rendered form."

  ToolCall:
    definition: >
      One `Tool` invocation requested by the model during a `Turn`: the tool
      name, its arguments, its result, its ToolOutcome, and (when the provider
      emits one) its `signature`. Every tool call MUST carry a `reason` — the
      universal *no reason, no go* gate refuses a call whose reason does not
      render, folding a recoverable result back to the model.
    attributes:
      - name: tool
        type: string
        description: The wire tool name.
      - name: reason
        type: string
        description: The model-authored justification; required by the universal gate.
      - name: outcome
        type: ToolOutcome
        description: The recorded fate of the call.
    relationships:
      - entity: Tool
        cardinality: "n:1"
        ownership: referenced
        note: The tool the call resolves to in the registry.
    invariants:
      - id: call-requires-a-reason
        statement: "A tool call MUST carry a renderable `reason`; a reason-less call is refused (it never executes)."
      - id: call-outcome-classified-structurally
        statement: "`outcome` is classified from the tool error and the loop-owned per-call deadline — never by sniffing the result text."

  Tool:
    definition: >
      A capability the model may invoke, advertised with a JSON argument schema.
      The surface is deliberately small: the reader trio (`list_files`,
      `read_files`, `get_tree`), the write pair (`write_file`, `replace_text`),
      `execute_command` (`bash -c`), and `list_skills`. When the selected
      `Provider` declares `vision`, one more tool is offered — `read_image`,
      which reads a local image and returns it **in-band** as an `ImageContent`
      (the shipped `tools.MediaPart` type; round 070 / ADR 0040) through the
      optional MediaTool capability. Every tool is
      bounded by the resource contract (`max_output_tokens` / `timeout` —
      default + param + ceiling) and requires a `reason`. There is no consent
      gate and no path boundary.
    attributes:
      - name: name
        type: string
        description: The unique wire tool name.
      - name: requiresReason
        type: boolean
        description: Always true — every tool call must carry a reason.
      - name: gate
        type: ToolGate
        description: >
          The capability gate (round 062 / ADR 0032): `vision` for `read_image`
          (offered only when the selected `Provider` declares `vision`), `none`
          otherwise — the readers, the write pair, `execute_command`, and
          `list_skills` are always offered.
    invariants:
      - id: tool-name-unique
        statement: "Each `Tool` has a unique name."
      - id: tool-result-bounded
        statement: "Every tool bounds its own output at the source; the loop clamp is the backstop."
      - id: tool-offered-only-when-capable
        statement: "`read_image` (its `gate` is `vision`) is offered to the model only when the selected `Provider` declares `vision`; the offered set is a function of the selected provider's capability."

  ImageContent:
    definition: >
      A piece of non-text media (an image) a `Tool` (`read_image`) returns
      **in-band** from its execution — the shipped type is `tools.MediaPart`
      (round 070 / ADR 0040). A media-producing tool implements the optional
      MediaTool capability, so a `read_image` call runs via ExecuteMedia,
      returning the text result **and** the media; the loop folds the media onto
      a `user` message after the tool result. The former per-call `context`
      collector (WithMediaCollector/AttachMedia, ADR 0032 D7a) is **retired**
      — the tool no longer reaches into the conversation model to name its own
      result type. Its kind is resolved from the file's **content** (magic
      bytes: JPEG/PNG/GIF/WebP), never the name; it is
      serialized inline on **both** families — a base64 `image_url` block on the
      OpenAI-compatible wire, or a base64 `inlineData` blob on the Gemini/Vertex
      wire (round 063 / ADR 0033) — riding a `user` message after the tool
      result. The media is in-flight only: it is never persisted with the `Turn`
      (the history step stores the tool's text result).
    attributes:
      - name: mimeType
        type: string
        description: The media type resolved from the file's content (a magic-byte sniff).
      - name: data
        type: object
        description: The image bytes, attached inline (never truncated).
    relationships:
      - entity: ToolCall
        cardinality: "n:1"
        ownership: referenced
        note: The tool call that produced (attached) the image.
    invariants:
      - id: image-kind-sniffed-from-content
        statement: "An `ImageContent`'s kind is resolved from the file's content (magic bytes), never the file name nor a declared MIME."
      - id: image-inline-limit
        statement: "An image larger than the selected provider's family-aware inline ceiling is a loud refusal — never truncated and never partially sent; the OpenAI-compatible family allows 32 MiB, the Gemini/Vertex family 14 MiB (round 063)."
      - id: image-never-silently-dropped
        statement: "An image is carried on either family or the turn fails loudly; it is never silently lost."

  MCPServer:
    definition: >
      An external MCP server declared under `MCP_SERVERS` — only a **remote**
      server (a URL entry) is supported; a COMMAND (local stdio) entry is warned
      about and skipped. Its tools are offered to the model with tellme's own
      `{reason, MCP_PAYLOAD}` envelope. The server still receives its own
      arguments, but the declaration the **model** is offered is filtered so a
      strict provider cannot reject the whole request: a family-agnostic floor
      drops vendor extensions (`x-…`, `$schema`), and for a closed-wire family
      (Vertex/Gemini) the declaration is projected onto the provider's supported
      schema surface (default-deny) before it reaches the wire.
    attributes:
      - name: name
        type: string
        description: The unique server key.
      - name: transport
        type: string
        description: "Only a URL entry (remote) is supported; a COMMAND (local stdio) entry is warn+skipped."
    relationships:
      - entity: MCPTool
        cardinality: "1:n"
        ownership: owned
        note: Tools discovered from this server.
    invariants:
      - id: mcp-server-definition-preserved
        statement: "The `MCPServer` still receives its own arguments — only the declaration **offered to the model** is filtered before the provider wire (vendor extensions dropped for every family; a closed-wire family receives only keywords its schema reader accepts)."
      - id: tool-declaration-fits-the-provider-wire
        statement: "A declaration offered to a closed-wire provider carries only keywords its schema reader accepts; tellme drops an unsupported keyword or a wrong-kind value rather than coerce it, and fails closed to the freeform object."
      - id: mcp-token-never-logged
        statement: "MCP credentials/headers MUST never be logged."

  MCPTool:
    definition: >
      A tool discovered from an `MCPServer`. The model must call it as tellme's
      own envelope `{reason, MCP_PAYLOAD}`; only `MCP_PAYLOAD` is forwarded to the
      server, and a call that is not a valid envelope is refused before the server
      is contacted.
    invariants:
      - id: mcp-call-is-an-envelope
        statement: "An MCP call MUST be a `{reason, MCP_PAYLOAD}` envelope; a non-envelope call is refused."
      - id: mcp-payload-forwarded-alone
        statement: "Only `MCP_PAYLOAD` reaches the server."

  Skill:
    definition: >
      A guidance block (a SKILL.md file) under the `$TELL_ME_HOME/docs/skills/`
      catalog. The surface is **on-demand only** (round 033 Q1) — a recorded
      divergence from the reference: tellme performs **no** automatic
      relevance-based injection into the `Context`. The model discovers the
      catalog with the `list_skills` tool (name + description + location,
      path-sorted) and reads a chosen skill's file with the existing `read_files`
      tool. Skills are authored as the BDD workflow's executable SOPs.
    attributes:
      - name: name
        type: string
        description: The unique skill identifier (frontmatter `name`).
      - name: description
        type: string
        description: Human-readable summary (frontmatter `description`).
      - name: location
        type: string
        description: The on-disk path the agent opens with `read_files`.
    invariants:
      - id: skill-unique-name
        statement: "A `Skill`'s name is unique across the catalog; the loader resolves a duplicate by keeping the first discovered and dropping the later one silently (no error)."
      - id: skill-on-demand-only
        statement: "A `Skill` reaches the model only on demand (`list_skills` + `read_files`); tellme performs no automatic relevance-based injection into the `Context`."

  Context:
    definition: >
      The provider payload assembled before each `Turn`: the `Persona` system
      prompt, the recent `History`, and the current prompt. Its size is reported
      by the `Chrome` as an estimate before the call and a measurement after it,
      against the effective budget. (No `Skill` content enters the `Context` —
      skills are on-demand only.)
    relationships:
      - entity: Persona
        cardinality: "n:1"
        ownership: referenced
      - entity: History
        cardinality: "n:1"
        ownership: referenced
    invariants:
      - id: context-figures-reported
        statement: "The `Context`'s size is reported twice per turn — an `estimated` pre-flight figure and a `measured` post-turn figure."

  Persona:
    definition: >
      The agent's identity for a session — a MODE and a PERSON system
      prompt. It is injected as the system message on every turn. The offline
      commands select a persona by mode.
    attributes:
      - name: mode
        type: string
        description: The persona identity.
      - name: person
        type: string
        description: The system prompt.
    invariants:
      - id: persona-injected-every-turn
        statement: "A session's `Persona` is injected as the system message on every turn."

  History:
    definition: >
      The persisted record of a session's completed `Turn`s — an append-only
      JSON-Lines file `history.jsonl` under `output/<mode>/`, plus an archive
      (`history.archive.jsonl`). One line per completed turn; a resumed session
      replays the stored steps (and their `signature`s) into the conversation.
    attributes:
      - name: line
        type: object
        description: A turn line `{prompt, answer, steps[], calls}`.
    relationships:
      - entity: Turn
        cardinality: "1:n"
        ownership: owned
    invariants:
      - id: history-append-after-complete
        statement: "A `Turn` is persisted only after it completes (append-only)."

  UsageRecord:
    definition: >
      One record per provider call in the per-mode `tokens.log`: the token
      breakdown and the cost. The Ready summary sums them into the session
      token totals and cost.
    relationships:
      - entity: Provider
        cardinality: "n:1"
        ownership: referenced
    invariants:
      - id: usage-summed-for-the-ready-summary
        statement: "The Ready summary's session totals are the sum of the session's `UsageRecord`s."

  TurnLog:
    definition: >
      The per-session plain-text file `output/<mode>/turns.log`: the subset of
      the rendered `Chrome` routed through the sink (the turn rule/header, the
      payload status lines, the grouped `[Tool Reason]` lines, the metrics line,
      and the Ready summary). It is written best-effort and read by the `-t`
      flag; the input-capture ack, prompt echo, errors, spinner, and the
      `[Tool Output]` block are not persisted.
    invariants:
      - id: turns-log-content-equal-but-plain
        statement: "`turns.log` follows the chrome's content but carries no colour."

  ToolUsageRecord:
    definition: >
      One line per **executed** `ToolCall` in the user-global
      `~/.tellme/tools-count.jsonl`: `{timestamp, tool, outcome}`. It is global
      (never reset by `--new`) and read by the `--tool-usage` flag, which prints
      per-registry-tool invocation counts.
    invariants:
      - id: tool-usage-global-and-best-effort
        statement: "The tool-usage log is global and best-effort — a write failure never breaks a turn."

  PromptLog:
    definition: >
      The shared, user-global prompt log at `~/.tellme/global_prompts.jsonl` —
      one `{timestamp, prompt}` JSON line per entered prompt. It seeds the `-i`
      suggestion engine (read newest-first, deduped); it is written only under
      `-i`, and seeded once from the environment-scoped file when absent.
    invariants:
      - id: prompt-log-written-only-interactively
        statement: "The shared prompt log is written only under the `-i` prompt."

  Chrome:
    definition: >
      The diagnostic surface on `stderr`: the turn rule and header, the payload
      status lines (`estimated` + `measured`), the `[Tool Reason]` / `[Tool
      Action]` / `[Tool Result]` / `[Tool Warning]` lines, the live `[Tool Output]` block, the turn
      spinner, and the Ready summary. Colour accents are **terminal-gated**
      (a terminal `stderr` with `-r` off) and never enter `stdout` or the
      `TurnLog`; the `[Tool …]` values are control-free and bounded; the answer
      (`stdout`) is separately rendered Markdown.
    attributes:
      - name: colour
        type: boolean
        description: Whether terminal-gated accents are on.
      - name: payloadFigure
        type: PayloadStatusKind
        description: The kind of the last payload figure the chrome reported.
    relationships:
      - entity: Turn
        cardinality: "n:1"
        ownership: referenced
    invariants:
      - id: chrome-colour-terminal-gated
        statement: "Colour appears only on a terminal `stderr` with `-r` off — never in `stdout` or `turns.log`."
      - id: chrome-tool-values-control-free
        statement: "Every `[Tool …]` value is folded, control-free, and rune-capped."
      - id: chrome-spinner-sample-cadence
        statement: "The spinner's braille frame stays on its fast cadence while its resource figures refresh at most once per second."

  PromptInput:
    definition: >
      The operator's input surface: the positional argument(s) and/or piped
      stdin (bounded 1 MiB), the plain multi-line terminal reader, and the
      opt-in interactive TUI prompt (`-i`) with a debounced suggestion engine.
      It is a behavioural role, not persisted state.
    attributes:
      - name: interactive
        type: boolean
        description: Whether the opt-in TUI prompt is engaged.
    invariants:
      - id: prompt-input-interactive-needs-a-terminal
        statement: "The interactive prompt engages only when `-i` is set AND stdin is a terminal."

scenarios:
  - name: A prompt turn
    description: >
      The user runs tellme with a prompt. The `Orchestrator` assembles the
      `Context`, shows the estimated payload line, calls the selected `Provider`,
      renders the answer, reports the measured payload + the Ready summary, and
      persists the `Turn`.
    actors: [Orchestrator, Config, Provider, Context, Chrome, Session, Turn]
    steps:
      - The user passes a prompt as an argument (and/or piped stdin).
      - "`Orchestrator` resolves the `Persona` and the `Provider` from the `Config`."
      - "`Orchestrator` assembles the `Context` and emits the `estimated` payload line."
      - "`Provider` returns the answer (a text Thought)."
      - "The answer is rendered to `stdout`; the `Chrome` emits the `measured` line + the Ready summary."
      - "`Orchestrator` persists the `Turn` to the `History` and records a `UsageRecord`."
    invariants_touched: [turn-answer-stored-verbatim, history-append-after-complete, context-figures-reported]

  - name: A tool-using turn
    description: >
      The model requests `execute_command`. Because the tool carries a `reason`,
      the loop runs it, streams the `[Tool Output]` block (grey on a terminal),
      folds the result back, and repeats until the final answer.
    actors: [Orchestrator, Tool, ToolCall, Chrome, Session]
    steps:
      - "`Provider` returns a tool call to `execute_command` carrying a `reason`."
      - "The universal gate accepts the call (the reason renders)."
      - "The tool runs through `bash -c`, bounded by the resource contract."
      - "The `Chrome` streams the `[Tool Output]` block to `stderr`."
      - The result is folded back; the loop repeats until a final answer.
    invariants_touched: [call-requires-a-reason, tool-result-bounded, chrome-tool-values-control-free]

  - name: A reason-less call is refused
    description: >
      The model requests a tool without a renderable reason. The universal gate
      (single-owned by the round-046 renderer) refuses the call — the tool does
      not execute — and folds a recoverable result asking the model to retry.
    actors: [Orchestrator, ToolCall]
    steps:
      - "`Provider` returns a tool call with no renderable `reason`."
      - "The gate refuses the call; the tool does not execute."
      - A recoverable `tool`-role result asking for a `reason` is folded back.
    invariants_touched: [call-requires-a-reason]

  - name: Resuming a session
    description: >
      A later process reads `history.jsonl` and replays the stored turns,
      including each step's provider `signature`, so a tool-using session resumes
      faithfully.
    actors: [Session, History, Turn, Context]
    steps:
      - "A new process loads the session's `History`."
      - "The stored `Turn`s (with their steps + signatures) are replayed into the `Context`."
      - The next `Turn` proceeds against the resumed conversation.
    invariants_touched: [history-append-after-complete]

  - name: An MCP tool call
    description: >
      The model calls an MCP-backed tool. It must be tellme's own
      `{reason, MCP_PAYLOAD}` envelope; only the payload reaches the server.
    actors: [MCPServer, MCPTool, ToolCall, Orchestrator]
    steps:
      - "`Provider` returns a call to an `MCPTool`."
      - "The call is checked to be a `{reason, MCP_PAYLOAD}` envelope."
      - "Only `MCP_PAYLOAD` is forwarded to the `MCPServer`."
    invariants_touched: [mcp-call-is-an-envelope, mcp-payload-forwarded-alone, mcp-server-definition-preserved]

  - name: A schema a strict provider cannot parse
    description: >
      A remote server annotates an argument with a vendor extension. tellme's
      family-agnostic floor drops the annotation, and a closed-wire transport
      projects the declaration onto the supported surface, so the turn reaches
      the model instead of failing with a whole-request rejection.
    actors: [MCPServer, MCPTool, Tool, Orchestrator]
    steps:
      - "An `MCPServer` advertises a tool whose argument carries a vendor-extension keyword (`x-…`)."
      - The floor drops the extension for every family.
      - "For a closed-wire family, the declaration is projected onto the provider's supported surface (default-deny)."
      - "The turn reaches the model; the server still receives its own arguments."
    invariants_touched: [mcp-server-definition-preserved, tool-declaration-fits-the-provider-wire]

  - name: Reading a local image
    description: >
      With a `Provider` that declares `vision`, the model calls `read_image`.
      The tool resolves the file's kind from its content and returns the media
      **in-band** from its execution (the MediaTool/ExecuteMedia capability;
      round 070 / ADR 0040); the loop folds it back on a `user` message after the
      tool result — so the model can see the picture. The media is carried on the
      selected family's wire: an inline base64 `image_url` block on the
      OpenAI-compatible family, or an inline base64 `inlineData` blob on the
      Gemini/Vertex family (round 063 / ADR 0033). A provider without `vision` is
      not offered the tool; an oversize (past the family-aware ceiling) or
      non-picture file is a loud refusal.
    actors: [Orchestrator, Tool, ToolCall, ImageContent, Provider]
    steps:
      - "`Provider` returns a call to `read_image` carrying a `reason`."
      - "The tool reads the file and resolves its kind from the content (magic bytes), and enforces the selected provider's family-aware inline ceiling."
      - "The tool returns the `ImageContent` **in-band** (via ExecuteMedia); the loop folds it onto a `user` message after the tool result."
      - "The adapter serializes the image on the family's wire (`image_url` / `inlineData`); the `Provider` sees it and the turn completes."
    invariants_touched: [tool-offered-only-when-capable, image-kind-sniffed-from-content, image-inline-limit, image-never-silently-dropped]

  - name: Listing and using skills
    description: >
      The model needs the project's SOP. It enumerates the catalog with the
      `list_skills` tool, then opens a chosen skill with `read_files`. tellme
      performs no automatic injection — a `Skill` reaches the model on demand
      only.
    actors: [Skill, Tool, Orchestrator]
    steps:
      - "The model calls the `list_skills` `Tool`, which returns each `Skill`'s name, description, and location (path-sorted)."
      - "The model reads the chosen `Skill`'s file with `read_files`."
    invariants_touched: [skill-unique-name, skill-on-demand-only]

  - name: The budget tracks the model
    description: >
      The effective token budget for a session derives from the configured
      `MAX_HISTORY_TOKENS` and the active model's `Pricing` window, and bounds the
      `Context` reported by the `Chrome`.
    actors: [Pricing, Config, Context, Provider]
    steps:
      - "`Config` names the selected `Provider` and the configured `MAX_HISTORY_TOKENS`."
      - "The active model's `Pricing` supplies its context window."
      - "The effective budget is the smaller of the two."
      - "The `Context` is reported against the effective budget."
    invariants_touched: [pricing-unique-model, context-figures-reported]

  - name: A provider family tellme cannot drive
    description: >
      The operator selects a provider whose label resolves to a family tellme
      does not drive. tellme refuses to proceed with the frozen provider-error
      phrase; no transport is built.
    actors: [Config, Provider, Orchestrator]
    steps:
      - "`Config` selects a `Provider` whose label resolves to no drivable family (e.g. `anthropic`)."
      - tellme refuses to proceed and reports the frozen provider-error phrase.
    invariants_touched: [provider-family-must-be-drivable]

  - name: Reading the session's logs
    description: >
      The offline readers surface the session's rendered chrome and the
      cumulative tool usage without any provider request.
    actors: [Session, TurnLog, ToolUsageRecord, History]
    steps:
      - "`-t` prints the session's `TurnLog` (`turns.log`)."
      - "`--tool-usage` prints per-tool counts from the global `ToolUsageRecord` log."
      - "`-l` prints the last persisted messages from the `History`."
    invariants_touched: [turns-log-content-equal-but-plain, tool-usage-global-and-best-effort, session-offline-reads-stay-offline]

  - name: An interactive prompt
    description: >
      With `-i` on a terminal, the session's `PromptInput` collects a prompt
      with live suggestions, and the entered prompt is appended to the shared
      `PromptLog`.
    actors: [PromptInput, PromptLog, Skill, Session]
    steps:
      - "`PromptInput` engages the TUI prompt (a terminal stdin)."
      - "The suggestion engine seeds from the `PromptLog`, the workspace, and the tool registry (the `PromptLog` — the user-global shared log — is the only prompt source; there is no separate session source)."
      - "The entered prompt is appended to the shared `PromptLog`."
    invariants_touched: [prompt-input-interactive-needs-a-terminal, prompt-log-written-only-interactively]

invariants:
  - id: no-security-layer
    statement: "`NoSecurityLayer` — tellme has no authorization/consent surface; tools act on whatever they are given (an accepted operator decision)."
  - id: posix-bash-only
    statement: "tellme targets bash on POSIX only — no Windows variant."
  - id: deterministic-and-hermetic
    statement: "Behaviour is deterministic; `make verify` is hermetic (ADR 0012)."
